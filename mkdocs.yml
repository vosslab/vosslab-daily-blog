site_name: Vosslab Work Log
site_description: Evidence-grounded field notes from Vosslab's public GitHub work.
site_url: http://aella.local:8016
site_dir: generated/check
exclude_docs: |
  /*.md
  !/index.md
  !/status.md
  /screenshots/

repo_name: vosslab
repo_url: https://github.com/vosslab
edit_uri: ""

copyright: >
  Copyright &copy; 2026 Neil R. Voss. Site content is licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">
    CC BY 4.0
  </a>.

theme:
  name: material
  language: en
  font: false
  favicon: assets/brand/vosslab-work-log-mark.svg
  logo: assets/brand/vosslab-work-log-mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - content.footer
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - blog:
      blog_dir: .
      post_dir: blog/posts
      post_url_format: blog/{date}/{slug}
      post_excerpt: required
      authors: false
      categories: false
      archive_url_format: blog/archive/{date}
      pagination_per_page: 6

nav:
  - Work log: index.md
  - Status: status.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vosslab
      name: Vosslab on GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/neilvosslab
      name: Neil Voss on YouTube
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/neilvosslab.bsky.social
      name: Neil Voss on Bluesky
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vosslab
      name: Neil Voss on LinkedIn
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/neilvosslab
      name: Neil Voss on Facebook
    - icon: fontawesome/brands/patreon
      link: https://www.patreon.com/vosslab
      name: Support Vosslab on Patreon
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/vosslab
      name: Support Vosslab with PayPal
