site_name: Vosslab Work Log
site_description: Private-LAN daily notes from Vosslab's public GitHub activity.
site_url: http://aella.local:8016
site_dir: generated/check
exclude_docs: |
  REPO_STYLE.md

repo_name: vosslab
repo_url: https://github.com/vosslab
edit_uri: ""

copyright: Copyright © Vosslab

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Use light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_excerpt: required
      authors: false
      categories: false

nav:
  - Home: index.md
  - Work log: blog/index.md
  - Status: status.md
  - Operations: operations.md
  - Architecture: CODE_ARCHITECTURE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
